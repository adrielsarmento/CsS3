<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CsS3 | til</title>
  <style>
    /* Configuração básica do painel (Padrão: Modo Claro) */
    .painel {
      padding: 40px;
      background-color: #ffffff;
      color: #333333;
      text-align: center;
      border-radius: 10px;
      transition: background-color 0.4s, color 0.4s; /* Deixa a troca suave */
    }

    /* Esconde o quadradinho feio do checkbox padrão */
    #alternador-modo {
      display: none;
    }

    /* Estilo do botão */
    .botao-tema {
      display: inline-block;
      padding: 10px 20px;
      background-color: #333333;
      color: #ffffff;
      cursor: pointer;
      border-radius: 5px;
      margin-bottom: 20px;
    }

    /* ========================================================= */
    /* A MÁGICA DO TIL (~) ACONTECE AQUI!                         */
    /* ========================================================= */

    /* SE o checkbox estiver marcado (:checked), procure o IRMÃO 
    chamado .texto-mensagem que vem DEPOIS dele e mude o texto */
    #alternador-modo:checked ~ .texto-mensagem::after {
      content: " MUDOU PARA MODO ESCURO! 🌙";
    }

    /* Vamos mudar a cor do próprio painel usando o til!
    Nota: Como o painel é o pai, vamos aplicar o estilo na mensagem */
    #alternador-modo:checked ~ .texto-mensagem {
      color: #ECEB17; /* O amarelo do seu logo! */
      background-color: black;
    }

    /* Se você colocar o background no body, o til muda a tela toda. 
    Aqui estamos dizendo: Se marcar, mude o estilo de quem vem depois! */
    /* SE o botão estiver marcado, procure o painel e mude o fundo dele! */
    #alternador-modo:checked ~ .painel {
      background-color: #1c1c1c; /* Deixa o fundo quase preto */
    }
    /* SE o body TIVER (:has) um #alternador-modo que esteja marcado (:checked) */
    body:has(#alternador-modo:checked) {
      background-color: #1c1c1c; /* Muda o fundo do site TODO para preto! */
    }
    body:has(#alternador-modo:checked) .painel {
      background-color: transparent; /* Faz a caixa branca sumir e misturar com o fundo preto! */
    }
  </style>
</head>
<body>
  <div class="painel">
    <!-- O checkbox que vai guardar o estado (marcado ou desmarcado) -->
    <input type="checkbox" id="alternador-modo">
    
    <!-- O botão visual que o usuário clica -->
    <label for="alternador-modo" class="botao-tema">Trocar de Modo</label>
    
    <!-- O texto que vai mudar de cor sozinho usando o til (~) -->
    <h2 class="texto-mensagem">Modo Claro Ativo!</h2>
  </div>
</body>
</html>
